name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze --fatal-infos

      - name: Run Tests
        run: flutter test

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 ausente. O APK será assinado com a chave padrão até que KEYSTORE_BASE64 seja configurada nos Secrets."
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neves-release.jks"
            echo "NEVES_KEYSTORE_PATH=$RUNNER_TEMP/neves-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK Release
        env:
          NEVES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NEVES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NEVES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Read App Version
        id: version
        run: |
          APP_VER=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "name=$APP_VER" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Neves-v${{ steps.version.outputs.name }}-build${{ github.run_number }}.apk"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neves-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Versioned Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.name }}-build${{ github.run_number }}
          name: "Neves v${{ steps.version.outputs.name }} (build ${{ github.run_number }})"
          body: |
            ### 📱 Neves Finanças v${{ steps.version.outputs.name }} — build ${{ github.run_number }}
            Commit: ${{ github.sha }}

            **Como instalar:** toque em `app-release.apk` abaixo e depois em **Instalar**.
            App financeiro pessoal 100% local-first inspirado nas diretrizes Apple HIG.
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/Neves-v${{ steps.version.outputs.name }}-build${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
