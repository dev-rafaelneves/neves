name: neves
description: "MVP enxuto de controle financeiro mensal (Receitas, Gastos à Vista e Faturas de Cartão de Crédito) com design Apple HIG."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.20.2
  share_plus: ^10.1.4
  file_selector: ^1.0.3
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
